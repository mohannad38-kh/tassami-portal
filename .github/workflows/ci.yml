name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/premium-site-improvements]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/tasami run build

      - name: Build API
        run: pnpm --filter @workspace/api-server run build
