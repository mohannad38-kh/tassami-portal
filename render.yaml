services:
  - type: web
    name: Tasami-Initiative
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/tasami run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: APP_BASE_URL
        value: https://tasami-initiative.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tassami-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        value: mohannadkhaloof38@gmail.com
      - key: ADMIN_BOOTSTRAP_TOKEN
        value: tasami_super_secure_admin_bootstrap_token_2024_default
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: tassami-db
    databaseName: tassami
    user: tassami
    plan: free
