services:
  - type: web
    name: Tasami-Initiative
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/tasami run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: APP_BASE_URL
        value: https://tassami-portal-1.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tassami-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Set SUPER_ADMIN_EMAILS and ADMIN_BOOTSTRAP_TOKEN in the Render dashboard before first login.
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: tassami-db
    databaseName: tassami
    user: tassami
    plan: free
